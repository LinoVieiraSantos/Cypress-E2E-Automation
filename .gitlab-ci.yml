image: cypress/included:16.0.0

stages:
  - test
  - report

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cypress_tests:
  stage: test

  image:
    name: cypress/included:16.0.0
    entrypoint: [""]

  before_script:
    - npm ci --cache .npm --prefer-offline

  script:
    - npm run test

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - allure-results/
      - cypress/screenshots/
      - cypress/videos/

generate_allure_report:
  stage: report

  image:
    name: cypress/included:16.0.0
    entrypoint: [""]

  needs:
    - job: cypress_tests
      artifacts: true

  script:
    - npm run allure:generate

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - allure-report/